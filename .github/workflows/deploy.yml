name: Deploy to Netlify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Netlify Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        run: |
          curl -s -X POST "${{ secrets.NETLIFY_DEPLOY_HOOK }}"
          echo "Deploy triggered → https://rdmedcare-new.netlify.app"
